name: Vigie backups · Vercel

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Vérification sans publication ou capture du créneau
        type: choice
        options: [verify, capture]
        default: verify

permissions:
  contents: read

concurrency:
  group: vigie-self-backups
  cancel-in-progress: false

jobs:
  backup:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment: vigie-self-backups
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Préparer le client PostgreSQL 18
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -x /usr/lib/postgresql/18/bin/pg_dump ]]; then
            if ! apt-cache show postgresql-client-18 >/dev/null 2>&1; then
              sudo install -d /usr/share/postgresql-common/pgdg
              curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
              printf '%s\n' 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/vigie-pgdg.list >/dev/null
              sudo apt-get update -qq
            fi
            sudo apt-get install -y --no-install-recommends postgresql-client-18
          fi
          printf '%s\n' /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"
      - name: Sauvegarder Vigie et sa base Neon
        env:
          DATABASE_URL: ${{ secrets.VIGIE_SELF_CATALOG_DATABASE_URL }}
          VIGIE_SELF_SOURCE_DATABASE_URL: ${{ secrets.VIGIE_SELF_SOURCE_DATABASE_URL }}
          VIGIE_RUNTIME_PROBE_KEY: ${{ secrets.VIGIE_RUNTIME_PROBE_KEY }}
          VIGIE_BACKUP_S3_BUCKET: ${{ secrets.VIGIE_BACKUP_S3_BUCKET }}
          VIGIE_BACKUP_S3_ENDPOINT: ${{ secrets.VIGIE_BACKUP_S3_ENDPOINT }}
          VIGIE_BACKUP_S3_KEY_ID: ${{ secrets.VIGIE_BACKUP_S3_KEY_ID }}
          VIGIE_BACKUP_S3_REGION: ${{ secrets.VIGIE_BACKUP_S3_REGION }}
          VIGIE_BACKUP_S3_SECRET: ${{ secrets.VIGIE_BACKUP_S3_SECRET }}
          MODE: ${{ inputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          private=$(mktemp -d)
          trap 'if mountpoint -q "$private"; then sudo umount "$private"; fi; rmdir "$private"' EXIT
          sudo mount -t tmpfs -o "noswap,nodev,nosuid,noexec,mode=0700,uid=$(id -u),gid=$(id -g),size=2G" tmpfs "$private"
          export VIGIE_BACKUP_SCRATCH_DIRECTORY="$private"
          args=()
          if [[ "$MODE" == verify ]]; then args+=(--verify); fi
          node --import tsx scripts/backup-vigie-vercel.ts "${args[@]}"
