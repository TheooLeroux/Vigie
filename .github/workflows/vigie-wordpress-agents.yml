name: Vigie automatic controls and WordPress agents
run-name: ${{ inputs.security_only && 'security-watch' || format('wordpress-agent-{0}', inputs.installation_id || 'reconcile') }}
on:
  workflow_dispatch:
    inputs:
      installation_id:
        description: Installation WordPress à préparer (vide pour le parc)
        required: false
        type: string
      request_id:
        description: Identifiant de la demande durable Vigie
        required: false
        type: string
      project_id:
        description: Projet à contrôler en lecture seule (vide pour le parc)
        required: false
        type: string
      security_only:
        description: Lancer le cycle de surveillance et le contrôle des agents WordPress
        default: false
        type: boolean
  push:
    branches: [main]
  deployment_status:
  schedule:
    - cron: '2-59/5 * * * *'
permissions:
  contents: read
jobs:
  agents:
    concurrency:
      group: wordpress-agent-${{ inputs.installation_id || 'reconcile' }}
      cancel-in-progress: false
    if: ${{ !cancelled() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && inputs.project_id == '' && (github.event_name != 'deployment_status' || github.event.deployment_status.state == 'success') }}
    environment: vigie-maintenance
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Vérifier et réparer les agents WordPress
        run: node --import tsx scripts/wordpress-agent-worker.ts
        env:
          DATABASE_URL: ${{ secrets.VIGIE_UPDATES_DATABASE_URL }}
          VIGIE_CONNECTOR_ENCRYPTION_KEY: ${{ secrets.VIGIE_UPDATES_ENCRYPTION_KEY }}
          VIGIE_AGENT_INSTALLATION_ID: ${{ inputs.installation_id }}
          VIGIE_AGENT_REQUEST_ID: ${{ inputs.request_id }}
          VIGIE_WORDPRESS_CONTROL_URL: https://vigie-azure.vercel.app
  wordpress-security:
    needs: wordpress-observations
    concurrency:
      group: wordpress-security-scan
      cancel-in-progress: false
    if: ${{ !cancelled() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && inputs.installation_id == '' && inputs.project_id == '' && (github.event_name != 'deployment_status' || github.event.deployment_status.state == 'success') }}
    environment: vigie-maintenance
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
        id: dependencies
      - name: Identifier les analyses WordPress et o2switch à renouveler
        id: plan
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node --import tsx scripts/automatic-control-worker.ts --plan
        env:
          DATABASE_URL: ${{ secrets.VIGIE_UPDATES_DATABASE_URL }}
          VIGIE_CONNECTOR_ENCRYPTION_KEY: ${{ secrets.VIGIE_UPDATES_ENCRYPTION_KEY }}
          VIGIE_CONTROL_PROVIDER: o2switch
          VIGIE_CONTROL_FORCE: ${{ github.event_name == 'push' || github.event_name == 'deployment_status' }}
      - name: Installer les scanners pour les sources hébergées
        if: ${{ !cancelled() && steps.plan.outputs.needed == 'true' }}
        run: node --import tsx scripts/install-update-scanners.ts
      - name: Analyser automatiquement les failles WordPress et les sources hébergées
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.plan.outputs.needed != 'false' }}
        run: node --import tsx scripts/automatic-control-worker.ts
        env:
          DATABASE_URL: ${{ secrets.VIGIE_UPDATES_DATABASE_URL }}
          VIGIE_CONNECTOR_ENCRYPTION_KEY: ${{ secrets.VIGIE_UPDATES_ENCRYPTION_KEY }}
          VIGIE_CONTROL_PROVIDER: o2switch
          VIGIE_CONTROL_FORCE: ${{ github.event_name == 'push' || github.event_name == 'deployment_status' }}
  observations:
    concurrency:
      group: ${{ matrix.provider == 'o2switch' && 'hosting-discovery-o2switch' || format('hosting-observation-{0}', matrix.provider) }}
      cancel-in-progress: false
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && inputs.installation_id == '' && (github.event_name != 'deployment_status' || github.event.deployment_status.state == 'success')
    environment: vigie-maintenance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        provider: [vercel, railway, o2switch]
    env:
      DATABASE_URL: ${{ secrets.VIGIE_UPDATES_DATABASE_URL }}
      VIGIE_CONNECTOR_ENCRYPTION_KEY: ${{ secrets.VIGIE_UPDATES_ENCRYPTION_KEY }}
      VIGIE_CONTROL_PROVIDER: ${{ matrix.provider }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Relever les projets et installations
        run: node --import tsx scripts/hosting-control-worker.ts
  wordpress-observations:
    concurrency:
      group: hosting-observation-o2switch
      cancel-in-progress: false
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && inputs.installation_id == '' && (github.event_name != 'deployment_status' || github.event.deployment_status.state == 'success')
    environment: vigie-maintenance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Renouveler les inventaires WordPress en lecture seule
        run: node --import tsx scripts/hosting-control-worker.ts --wordpress-observations
        env:
          DATABASE_URL: ${{ secrets.VIGIE_UPDATES_DATABASE_URL }}
          VIGIE_CONNECTOR_ENCRYPTION_KEY: ${{ secrets.VIGIE_UPDATES_ENCRYPTION_KEY }}
          VIGIE_CONTROL_PROVIDER: o2switch
          VIGIE_CONTROL_PROJECT_ID: ${{ inputs.project_id }}
          VIGIE_WORDPRESS_CONTROL_URL: https://vigie-azure.vercel.app
  providers:
    needs: observations
    concurrency:
      group: hosting-control-${{ matrix.provider }}-${{ inputs.project_id || 'fleet' }}
      cancel-in-progress: false
    if: ${{ !cancelled() && needs.observations.result != 'skipped' }}
    environment: vigie-maintenance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.VIGIE_UPDATES_DATABASE_URL }}
      VIGIE_CONNECTOR_ENCRYPTION_KEY: ${{ secrets.VIGIE_UPDATES_ENCRYPTION_KEY }}
      VIGIE_CONTROL_PROVIDER: ${{ matrix.provider }}
      VIGIE_CONTROL_FORCE: ${{ github.event_name == 'push' || github.event_name == 'deployment_status' || inputs.project_id != '' }}
      VIGIE_CONTROL_PROJECT_ID: ${{ inputs.project_id }}
      VIGIE_UPDATES_GITHUB_TOKENS: ${{ secrets.VIGIE_MAINTENANCE_GITHUB_TOKENS }}
      VIGIE_UPDATES_GITHUB_TOKEN_JANSSEN76140: ${{ secrets.VIGIE_MAINTENANCE_GITHUB_TOKEN_JANSSEN76140 }}
      VIGIE_MINIMAL_STATIC_SERVICES: ${{ vars.VIGIE_MINIMAL_STATIC_SERVICES }}
      VIGIE_UPDATES_REPOSITORIES: ${{ vars.VIGIE_MAINTENANCE_REPOSITORIES }}
    strategy:
      fail-fast: false
      matrix:
        provider: [vercel, railway]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
        id: dependencies
      - name: Identifier les analyses horaires ou les nouveaux déploiements
        id: plan
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node --import tsx scripts/automatic-control-worker.ts --plan
      - name: Installer les scanners de sécurité vérifiés
        if: ${{ !cancelled() && steps.plan.outputs.needed == 'true' }}
        run: node --import tsx scripts/install-update-scanners.ts
      - name: Analyser les failles et vérifier les mises à jour du parc
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.plan.outputs.needed != 'false' }}
        run: node --import tsx scripts/automatic-control-worker.ts
