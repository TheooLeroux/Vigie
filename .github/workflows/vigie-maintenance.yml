name: Vigie maintenance
run-name: vigie-maintenance-${{ fromJSON(inputs.job).id }}
on:
  workflow_dispatch:
    inputs:
      job:
        description: Plan Vigie validé, sans secret
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: vigie-maintenance-${{ fromJSON(inputs.job).repository }}
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment: vigie-maintenance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Mettre à jour et publier après vérification isolée
        run: node --import tsx scripts/maintenance-worker.ts
        env:
          VIGIE_MAINTENANCE_JOB: ${{ inputs.job }}
          VIGIE_MAINTENANCE_GITHUB_TOKEN: ${{ secrets.VIGIE_MAINTENANCE_GITHUB_TOKEN }}
          VIGIE_MAINTENANCE_GITHUB_TOKENS: ${{ secrets.VIGIE_MAINTENANCE_GITHUB_TOKENS }}
          VIGIE_MAINTENANCE_REPOSITORIES: ${{ vars.VIGIE_MAINTENANCE_REPOSITORIES }}
