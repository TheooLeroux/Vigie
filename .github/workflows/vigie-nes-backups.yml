name: Vigie backups · NES App

on:
  workflow_call:
    inputs:
      mode:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      mode:
        description: Vérification sans publication ou capture du créneau
        type: choice
        options: [verify, capture]
        default: verify

permissions:
  contents: read

concurrency:
  group: vigie-nes-backups
  cancel-in-progress: false

jobs:
  backup:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment: vigie-nes-backups
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Préparer le client PostgreSQL 17
        shell: bash
        run: bash scripts/prepare-backup-postgres.sh 17
      - name: Sauvegarder les sources Railway et la base Supabase
        env:
          DATABASE_URL: ${{ secrets.VIGIE_BACKUP_DATABASE_URL }}
          VIGIE_BACKUP_S3_BUCKET: ${{ secrets.VIGIE_BACKUP_S3_BUCKET }}
          VIGIE_BACKUP_S3_ENDPOINT: ${{ secrets.VIGIE_BACKUP_S3_ENDPOINT }}
          VIGIE_BACKUP_S3_KEY_ID: ${{ secrets.VIGIE_BACKUP_S3_KEY_ID }}
          VIGIE_BACKUP_S3_REGION: ${{ secrets.VIGIE_BACKUP_S3_REGION }}
          VIGIE_BACKUP_S3_SECRET: ${{ secrets.VIGIE_BACKUP_S3_SECRET }}
          VIGIE_NES_DATABASE_PASSWORD: ${{ secrets.VIGIE_NES_DATABASE_PASSWORD }}
          VIGIE_NES_RAILWAY_TOKEN: ${{ secrets.VIGIE_NES_RAILWAY_TOKEN }}
          VIGIE_BACKUP_INVENTORY_DATABASE_URL: ${{ secrets.VIGIE_BACKUP_INVENTORY_DATABASE_URL }}
          VIGIE_BACKUP_GITHUB_APP_ID: ${{ vars.VIGIE_BACKUP_GITHUB_APP_ID }}
          VIGIE_BACKUP_GITHUB_APP_KEY: ${{ secrets.VIGIE_BACKUP_GITHUB_APP_KEY }}
          SOURCE_KEY: ${{ secrets.VIGIE_NES_GITHUB_KEY }}
          SOURCE_HOSTS: ${{ vars.VIGIE_NES_GITHUB_KNOWN_HOSTS }}
          SUPABASE_CA: ${{ vars.VIGIE_NES_SUPABASE_CA }}
          MODE: ${{ inputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          private=$(mktemp -d)
          trap 'if mountpoint -q "$private"; then sudo umount "$private"; fi; rmdir "$private"' EXIT
          sudo mount -t tmpfs -o "noswap,nodev,nosuid,noexec,mode=0700,uid=$(id -u),gid=$(id -g),size=2G" tmpfs "$private"
          mkdir "$private/scratch"
          printf '%s\n' "$SOURCE_KEY" > "$private/identity"
          printf '%s\n' "$SOURCE_HOSTS" > "$private/known_hosts"
          printf '%s\n' "$SUPABASE_CA" > "$private/supabase.crt"
          unset SOURCE_KEY SOURCE_HOSTS SUPABASE_CA
          export GIT_SSH_COMMAND="ssh -F /dev/null -i $private/identity -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$private/known_hosts -o GlobalKnownHostsFile=/dev/null"
          export VIGIE_NES_SUPABASE_CA="$private/supabase.crt"
          export VIGIE_BACKUP_SCRATCH_DIRECTORY="$private/scratch"
          args=()
          case "$MODE" in
            verify) args+=(--verify) ;;
            capture) ;;
            automatic) args+=(--automatic) ;;
            automatic-verify) args+=(--automatic-verify) ;;
            verify-r2) args+=(--verify-r2) ;;
            *) exit 1 ;;
          esac
          node --import tsx scripts/backup-nes-railway.ts "${args[@]}"
