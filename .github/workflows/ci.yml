name: Vigie CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: vigie_test
          POSTGRES_PASSWORD: vigie_test_local
          POSTGRES_DB: vigie_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vigie_test -d vigie_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
        env:
          VIGIE_TEST_DOCKER: "1"
          VIGIE_TEST_WORDPRESS: "1"
          VIGIE_TEST_WORDPRESS_AGENT: "1"
          VIGIE_UPDATES_TEST_DATABASE_URL: postgresql://vigie_test:vigie_test_local@127.0.0.1:5432/vigie_test
      - run: npm run build
